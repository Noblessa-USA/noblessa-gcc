# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: Noblessa-USA/noblessa-gcc
  branch: production
  identity_url: https://auth.decapbridge.com/sites/e75fb648-934b-4159-a7fd-27d44c2447eb
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Callowhill Web Designs Logo
logo:
  src: https://callowhillwebdesigns.com/assets/images/logoforemail.png
  show_in_header: true

# Display URL in top bar of Decap CMS
display_url: https://noblessa.me

# Add site links in Decap CMS (optional)
site_url: https://noblessa.me

# Keep this to allow you to edit the cms locally
local_backend: true

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"


# Decap CMS Collections
collections:
    - name: "blog"
      label: "Blog"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}"
      fields:
          # ── Shared fields ──────────────────────────────────────────────────
          - {
                label: "URL Slug",
                name: "url",
                widget: "string",
                hint: 'Specify where the page will be written to. If you use "Blog Post", the post will be accessible from "blog/blog-post"',
            }
          - { label: "Author", name: "author", widget: "string", hint: 'This is only viewable internally. End users cannot see blog post authors.' }
          - { label: "Date", name: "date", widget: "datetime", hint: 'The date this article is published. If the date is set sometime in the future, the blog post will not appear on the site until that time and date. Make sure this is set to a time in the past to have it appear on the main blog page.' }
          - { label: "Featured Image", name: "image", widget: "image", hint: 'This image will be used as the cover image for the blog post. Recommended Minimum dimensions: 1200x630 pixels.' }

          # ── English content ────────────────────────────────────────────────
          - { label: "Title (English)", name: "title", widget: "string" }
          - { label: "Description (English)", name: "description", widget: "string", hint: 'Brief summary used for SEO meta description and article preview.' }
          - { label: "Tags (English)", name: "tags", widget: "list", default: ["post"], hint: 'Add "post" to display on the blog listing. Available tags: "Design Tips", "Kitchens", "Bathrooms", "Living Rooms", "Trends", "News", "Partners", "Info", "Remodel".' }
          - { label: "Image Caption (English)", name: "imageAlt", widget: "string", hint: 'Descriptive alt text for the featured image (SEO & accessibility).' }
          - { label: "Body (English)", name: "body", widget: "markdown" }

          # ── Arabic content ─────────────────────────────────────────────────
          - { label: "Title (Arabic)", name: "title_ar", widget: "string", hint: 'العنوان بالعربية' }
          - { label: "Description (Arabic)", name: "description_ar", widget: "string", hint: 'وصف مختصر يُستخدم في SEO ومعاينة المقال.' }
          - { label: "Tags (Arabic)", name: "tags_ar", widget: "list", default: ["post"], hint: 'أضف "post" لعرض المقال في قائمة المدونة.' }
          - { label: "Image Caption (Arabic)", name: "imageAlt_ar", widget: "string", hint: 'نص بديل وصفي للصورة المميزة (SEO وإمكانية الوصول).' }
          - { label: "Body (Arabic)", name: "body_ar", widget: "markdown", hint: 'محتوى المقال بالعربية.' }
    
    - name: "kitchen-collections"
      label: "Kitchen Collections"
      label_singular: "Kitchen Collection"
      folder: "src/content/kitchen-collections"
      create: true
      slug: "{{slug}}"
      media_folder: "/src/assets/images/kitchen/{{slug}}"
      public_folder: "/assets/images/kitchen/{{slug}}"
      fields:
          - { label: "Collection Name", name: "title", widget: "string", hint: 'Name of the kitchen collection (e.g., "Tempo", "Grace", "Divine")' }
          - {
                label: "URL Slug",
                name: "url",
                widget: "string",
                hint: 'Specify where the page will be written to. If you use "tempo", the collection will be accessible from "kitchen-collections/tempo"',
            }
          - { label: "Short Description", name: "description", widget: "text", hint: 'Brief description shown on the main collections page. Keep it concise (1-2 sentences).' }
          - { label: "Meta Description", name: "metaDescription", widget: "string", hint: 'SEO meta description for search engines.' }
          - { label: "Header Image", name: "headerImage", widget: "image", hint: 'Primary hero image for the collection page header. Recommended: High-quality, landscape orientation.' }
          - { label: "Header Image Alt Text", name: "headerImageAlt", widget: "string", hint: 'Describe the header image for accessibility and SEO.' }
          - { label: "Card Image", name: "cardImage", widget: "image", hint: 'Thumbnail image shown on the main collections page.' }
          - { label: "Card Image Alt Text", name: "cardImageAlt", widget: "string", hint: 'Describe the card image for accessibility.' }
          - { label: "Card Image Secondary", name: "cardImageSecondary", widget: "image", hint: 'Secondary thumbnail image for the collection card (alternative view).' }
          - { label: "Card Image Secondary Alt Text", name: "cardImageSecondaryAlt", widget: "string", hint: 'Describe the secondary card image for accessibility.' }
          - { label: "Featured Description", name: "featuredDescription", widget: "markdown", hint: 'Detailed description of the collection displayed prominently on the collection page.' }
          - { label: "Featured Image", name: "featuredImage", widget: "image", hint: 'Image accompanying the featured description section.' }
          - { label: "Featured Image Alt Text", name: "featuredImageAlt", widget: "string", hint: 'Describe the featured image for accessibility.' }
          - { label: "Gallery Images", name: "galleryImages", widget: "list", fields: [
                { label: "Image", name: "image", widget: "image" },
                { label: "Alt Text", name: "alt", widget: "string" }
            ], hint: 'Add multiple images to create a gallery for this collection.' }
          - { label: "Order", name: "order", widget: "number", default: 100, hint: 'Controls the display order on the main collections page. Lower numbers appear first.' }
          - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: 'Mark as featured to highlight this collection.' }
